<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查察組 留守輪值表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f4ef;--bg2:#eee9e0;--card:#faf8f4;--border:#ddd8ce;
  --text:#3a3530;--text2:#7a7068;--text3:#a89f94;
  --accent-a:#8b7355;--accent-b:#6b7c6b;--red:#c0614a;--meeting:#b07040;
  --green:#5a7a5a;--shadow:rgba(58,53,48,.08);
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-weight:300;min-height:100vh;padding-bottom:60px;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:50;}
.header-inner{max-width:560px;margin:0 auto;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.header-left .sub{font-size:10px;color:var(--text3);letter-spacing:3px;margin-bottom:2px;}
.header-left .title{font-size:17px;font-weight:600;color:var(--text);letter-spacing:1px;}
.header-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.icon-btn{background:var(--bg2);border:1px solid var(--border);border-radius:16px;color:var(--text2);padding:5px 10px;cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;font-family:inherit;transition:all .2s;}
.icon-btn:hover{background:var(--border);}
.icon-btn.active{background:#c09060;border-color:#c09060;color:#fff;}
.icon-btn.danger{background:#fdf0ee;border-color:#e8c0b8;color:var(--red);}
.icon-btn.auto{background:#f0f4f0;border-color:#b8d0b8;color:#4a6a4a;}
.icon-btn.admin-on{background:#3a3530;border-color:#3a3530;color:#faf8f4;}
.group-tabs{display:flex;gap:6px;margin-bottom:8px;}
.group-tab{flex:1;padding:7px 0;border:1px solid var(--border);border-radius:16px;cursor:pointer;font-family:inherit;font-size:12px;background:var(--bg2);color:var(--text2);transition:all .2s;text-align:center;}
.group-tab.active-a{background:var(--accent-a);border-color:var(--accent-a);color:#fff;font-weight:500;}
.group-tab.active-b{background:var(--accent-b);border-color:var(--accent-b);color:#fff;font-weight:500;}
.view-tabs{display:flex;background:var(--bg2);border-radius:16px;padding:3px;}
.view-tab{flex:1;padding:5px 0;border:none;border-radius:13px;cursor:pointer;font-family:inherit;font-size:11px;background:transparent;color:var(--text2);transition:all .2s;}
.view-tab.active{background:var(--card);color:var(--text);font-weight:500;box-shadow:0 1px 4px var(--shadow);}
.month-nav{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:12px auto 0;padding:0 16px;}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;}
.month-label{font-size:14px;font-weight:500;}
.main{max-width:560px;margin:10px auto 0;padding:0 12px;}
.swap-banner{margin-bottom:8px;padding:8px 12px;background:#fdf3e7;border:1px solid #e8c88a;border-radius:10px;font-size:12px;color:var(--meeting);}
.legend{display:flex;gap:10px;padding:3px 2px 7px;font-size:10px;color:var(--text3);flex-wrap:wrap;}

/* Calendar */
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.weekday{text-align:center;font-size:9px;font-weight:500;color:var(--text3);padding:3px 0;letter-spacing:1px;}
.weekday.weekend{color:var(--red);opacity:.7;}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.day-cell{border-radius:8px;padding:4px 2px;text-align:center;cursor:pointer;background:var(--card);border:1px solid var(--border);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;user-select:none;transition:all .15s;}
.day-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.day-cell.weekend{opacity:0.35;cursor:default;background:var(--bg);}
.day-cell.holiday{background:#fdf0ee;border-color:#e8c0b8;opacity:1;cursor:default;}
.day-cell.today{border:1.5px solid var(--accent-a);}
.day-cell.swap-sel{background:#fdf3e7;border:1.5px solid #c09060;}
.day-num{font-size:10px;color:var(--text2);line-height:1.2;}
.day-num.today{color:var(--accent-a);font-weight:600;}
.day-num.hol{color:var(--red);font-weight:500;}
.hol-name{font-size:7px;color:var(--red);line-height:1;width:95%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.person-badge{font-size:9px;font-weight:500;border-radius:4px;padding:1px 2px;width:94%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;}
.ev-badge{font-size:7px;border-radius:3px;padding:1px 2px;width:94%;text-align:center;white-space:nowrap;overflow:hidden;line-height:1.3;}

/* Stats */
.stats-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.stats-title{font-size:10px;color:var(--text3);letter-spacing:1px;margin-bottom:8px;font-weight:500;}
.stat-chip{display:flex;align-items:center;gap:4px;border-radius:14px;padding:4px 9px;border:1px solid var(--border);}
.stat-name{font-size:11px;font-weight:500;}
.stat-count{font-size:10px;color:var(--text3);}

/* List */
.list-view{margin-top:4px;}
.list-empty{text-align:center;color:var(--text3);padding:24px;font-size:12px;}
.list-item{padding:10px 13px;margin-bottom:5px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s;}
.list-item:hover:not(.holiday){border-color:var(--accent-a);}
.list-item.holiday{background:#fdf0ee;border-color:#e8c0b8;cursor:default;}
.list-item.unassigned{border-style:dashed;}
.list-item-top{display:flex;align-items:center;justify-content:space-between;}
.list-date{font-size:12px;color:var(--text2);}
.list-wd{font-size:11px;color:var(--text3);}
.list-evs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.list-ev{font-size:10px;border-radius:6px;padding:2px 6px;}
.list-person{font-size:13px;font-weight:500;}
.inline-assign{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.inline-title{font-size:10px;color:var(--text3);margin-bottom:6px;}
.inline-btns{display:flex;flex-wrap:wrap;gap:5px;}
.inline-btn{border-radius:7px;padding:4px 8px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text2);}
.inline-btn.sel{font-weight:700;}
.inline-btn.clr{border-style:dashed;color:var(--text3);}

/* Overlay / Modal / Panel */
.overlay{position:fixed;inset:0;background:rgba(58,53,48,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.overlay.center{align-items:center;}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:560px;border-top:1px solid var(--border);}
.modal-box.center{border-radius:16px;padding:22px 20px;max-width:360px;}
.modal-title{font-size:13px;color:var(--text2);margin-bottom:14px;font-weight:500;}
.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.modal-btn{border-radius:9px;padding:8px 3px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;transition:all .15s;border:1px solid var(--border);}
.panel-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;border-top:1px solid var(--border);}
.panel-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text);}
.panel-sec{margin-bottom:16px;}
.panel-sec-title{font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:8px;font-weight:500;}
.panel-row{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
.panel-input{flex:1;min-width:70px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none;}
.panel-input:focus{border-color:var(--accent-a);}
.color-pick{width:36px;height:34px;border-radius:9px;border:1px solid var(--border);cursor:pointer;padding:2px;}
.panel-btn{background:var(--accent-a);border:none;border-radius:9px;color:#fff;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;}
.panel-btn.b{background:var(--accent-b);}
.panel-btn.r{background:var(--red);}
.member-tags{display:flex;flex-wrap:wrap;gap:6px;}
.member-tag{display:flex;align-items:center;gap:5px;border-radius:16px;padding:4px 9px;border:1px solid var(--border);}
.member-tag-name{font-size:11px;font-weight:500;}
.member-tag-rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:0;opacity:.7;}
.ev-item{margin-bottom:10px;}
.ev-item-head{display:flex;align-items:center;margin-bottom:5px;}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;}
.ev-item-title{font-size:12px;font-weight:500;flex:1;}
.ev-item-rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;opacity:.7;}
.ev-dates{display:flex;flex-wrap:wrap;gap:4px;}
.ev-date-chip{display:flex;align-items:center;gap:3px;border-radius:10px;padding:3px 8px;font-size:11px;}
.ev-date-rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;padding:0;}

/* Swap request */
.swap-req{padding:10px 12px;margin-bottom:6px;border-radius:10px;background:var(--card);border:1px solid var(--border);}
.swap-req.pending{border-color:#e8c88a;background:#fdf9f2;}
.swap-req.approved{border-color:#b8d0b8;background:#f2f7f2;}
.swap-req.rejected{border-color:#e8c0b8;background:#fdf0ee;opacity:.7;}
.swap-req-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.swap-req-info{font-size:12px;color:var(--text);}
.swap-req-time{font-size:10px;color:var(--text3);}
.swap-req-detail{font-size:11px;color:var(--text2);margin-bottom:6px;}
.swap-req-btns{display:flex;gap:6px;}
.swap-approve{background:#f0f7f0;border:1px solid #b8d0b8;color:var(--green);border-radius:8px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;}
.swap-reject{background:#fdf0ee;border:1px solid #e8c0b8;color:var(--red);border-radius:8px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;}
.badge-pending{background:#fdf3e7;color:#b07040;border:1px solid #e8c88a;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:500;}
.badge-approved{background:#f0f7f0;color:var(--green);border:1px solid #b8d0b8;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:500;}
.badge-rejected{background:#fdf0ee;color:var(--red);border:1px solid #e8c0b8;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:500;}

/* Admin login */
.login-box{background:var(--card);border-radius:16px;padding:24px 20px;width:100%;max-width:300px;}
.login-title{font-size:14px;font-weight:600;margin-bottom:16px;text-align:center;}
.login-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:4px;}
.login-btn{width:100%;background:var(--accent-a);border:none;border-radius:10px;color:#fff;padding:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;}
.login-err{font-size:11px;color:var(--red);text-align:center;margin-top:6px;}

/* Confirm */
.confirm-btns{display:flex;gap:8px;margin-top:14px;}
.confirm-btn{flex:1;padding:9px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;}
.confirm-btn.yes{background:var(--red);color:#fff;}
.confirm-btn.no{background:var(--bg2);color:var(--text2);border:1px solid var(--border);}

/* Notification dot */
.notif-dot{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:3px;vertical-align:middle;}

.chk-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.chk-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--red);}
.select-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;flex-wrap:wrap;}
.select-bar-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px;color:var(--text2);}
.select-bar-btn.del{border-color:#e8c0b8;color:var(--red);background:#fdf0ee;}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#faf8f4;padding:8px 18px;border-radius:18px;font-size:12px;font-weight:500;z-index:300;box-shadow:0 4px 16px var(--shadow);white-space:nowrap;pointer-events:none;}
.saving{position:fixed;bottom:14px;right:14px;background:var(--card);color:var(--text3);padding:5px 10px;border-radius:10px;font-size:10px;border:1px solid var(--border);}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-size:13px;color:var(--text3);letter-spacing:2px;background:var(--bg);gap:10px;}
.loading-dot{width:7px;height:7px;background:var(--accent-a);border-radius:50%;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.hidden{display:none!important;}
.group-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loading-dot"></div><span>連線中⋯</span></div>
<div id="app" class="hidden">
  <div class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="header-left">
          <div class="sub">INSPECTION TEAM</div>
          <div class="title">留守輪值表</div>
        </div>
        <div class="header-btns" id="header-btns">
          <!-- Rendered by JS -->
        </div>
      </div>
      <div class="group-tabs">
        <button class="group-tab active-a" id="group-a" onclick="switchGroup('A')"><span class="group-dot" style="background:#8b7355"></span>A 查察組</button>
        <button class="group-tab" id="group-b" onclick="switchGroup('B')"><span class="group-dot" style="background:#6b7c6b"></span>B 查察組</button>
      </div>
      <div class="view-tabs" id="view-tabs-bar">
        <button class="view-tab active" id="tab-calendar" onclick="switchTab('calendar')">📅 月曆</button>
        <button class="view-tab" id="tab-list" onclick="switchTab('list')">📋 清單</button>
        <button class="view-tab hidden" id="tab-stats" onclick="switchTab('stats')">📊 統計</button>
        <button class="view-tab" id="tab-swap" onclick="switchTab('swap')">🔄 換班紀錄<span id="swap-notif" class="notif-dot hidden"></span></button>
      </div>
    </div>
  </div>
  <div style="background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px 10px;position:sticky;top:var(--header-h,0);z-index:49;">
    <div style="display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;">
      <button onclick="changeMonth(-1)" style="background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px;color:var(--text);display:flex;align-items:center;justify-content:center;line-height:1;">‹</button>
      <span id="month-label" style="font-size:15px;font-weight:600;color:var(--text)"></span>
      <button onclick="changeMonth(1)" style="background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px;color:var(--text);display:flex;align-items:center;justify-content:center;line-height:1;">›</button>
    </div>
  </div>
  <div class="main">
    <div id="swap-banner" class="swap-banner hidden"></div>
    <div class="legend" id="legend"></div>
    <div id="calendar-view">
      <div class="weekdays">
        <div class="weekday weekend">日</div><div class="weekday">一</div><div class="weekday">二</div>
        <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div>
        <div class="weekday weekend">六</div>
      </div>
      <div id="calendar-grid"></div>
    </div>
    <div id="list-view" class="list-view hidden"></div>
    <div id="stats-view" class="hidden"></div>
    <div id="swap-view" class="hidden"></div>
  </div>
</div>

<!-- Edit Modal (admin only) -->
<div id="edit-modal" class="overlay hidden" onclick="closeEditModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-grid" id="modal-grid"></div>
  </div>
</div>

<!-- Confirm Clear -->
<div id="confirm-modal" class="overlay center hidden">
  <div class="modal-box center">
    <div class="modal-title">確定清除 <span id="confirm-month"></span> 排班？</div>
    <div style="font-size:12px;color:var(--text3)">此操作無法復原</div>
    <div class="confirm-btns">
      <button class="confirm-btn no" onclick="closeConfirm()">取消</button>
      <button class="confirm-btn yes" onclick="clearMonth()">確定清除</button>
    </div>
  </div>
</div>

<!-- Admin Login -->
<div id="login-modal" class="overlay center hidden">
  <div class="login-box">
    <div class="login-title">🔐 管理員登入</div>
    <input class="login-input" type="password" id="login-pwd" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err hidden" id="login-err">密碼錯誤</div>
  </div>
</div>

<!-- Members Panel -->
<div id="members-panel" class="overlay hidden" onclick="closePanel('members',event)">
  <div class="panel-box" onclick="event.stopPropagation()">
    <div class="panel-title" id="members-panel-title">👤 成員管理</div>
    <div class="panel-row">
      <input class="panel-input" id="new-member-input" placeholder="新增成員姓名" onkeydown="if(event.key==='Enter')addMember()">
      <button class="panel-btn" onclick="addMember()">新增</button>
    </div>
    <div class="member-tags" id="member-tags"></div>
  </div>
</div>

<!-- Events Panel -->
<div id="events-panel" class="overlay hidden" onclick="closePanel('events',event)">
  <div class="panel-box" onclick="event.stopPropagation()">
    <div class="panel-title">🏷 標示管理（兩組共用）</div>
    <div class="panel-sec">
      <div class="panel-sec-title">新增標示</div>
      <div class="panel-row">
        <input class="panel-input" id="new-ev-name" placeholder="名稱（例：科長休假）" style="min-width:120px">
        <input type="color" class="color-pick" id="new-ev-color" value="#b07040">
      </div>
      <div class="panel-row">
        <input class="panel-input" id="new-ev-date" type="date">
        <button class="panel-btn" onclick="addEvDate()">新增日期</button>
      </div>
    </div>
    <div class="panel-sec">
      <div class="panel-sec-title">現有標示</div>
      <div id="ev-list"></div>
    </div>
  </div>
</div>

<!-- Swap Request Modal -->
<div id="swap-req-modal" class="overlay hidden" onclick="closeSwapReqModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <span style="font-size:14px;font-weight:600">🔄 申請換班</span>
      <button onclick="closeSwapReqModal()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);margin-bottom:5px">日期 1</div>
        <input type="date" id="swap-date1" class="panel-input" style="width:100%" onchange="onSwapDateChange()">
      </div>
      <div style="font-size:18px;color:var(--text3);padding-top:18px">⇄</div>
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);margin-bottom:5px">日期 2</div>
        <input type="date" id="swap-date2" class="panel-input" style="width:100%" onchange="onSwapDateChange()">
      </div>
    </div>
    <div id="swap-preview" style="font-size:12px;color:var(--text2);min-height:18px;padding:8px 10px;background:var(--bg2);border-radius:8px;text-align:center;margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">

// ── Firebase ───────────────────────────────────────────────
async function initFirebase(){
  try{
    for(const g of ['A','B']){
      const ss=await get(ref(db,`roster/${g}/schedule`));
      const sm=await get(ref(db,`roster/${g}/members`));
      if(!ss.exists()) await set(ref(db,`roster/${g}/schedule`),GROUPS[g].schedule);
      if(!sm.exists()) await set(ref(db,`roster/${g}/members`),GROUPS[g].members);
      onValue(ref(db,`roster/${g}/schedule`),snap=>{liveData[g].schedule={...GROUPS[g].schedule,...(snap.val()||{})};if(g===currentGroup)render();});
      onValue(ref(db,`roster/${g}/members`),snap=>{liveData[g].members=snap.val()||[...GROUPS[g].members];if(g===currentGroup)render();});
    }
    const se=await get(ref(db,'roster/shared/events'));
    if(!se.exists()) await set(ref(db,'roster/shared/events'),INITIAL_EVENTS);
    onValue(ref(db,'roster/shared/events'),snap=>{liveData.events=snap.val()||JSON.parse(JSON.stringify(INITIAL_EVENTS));render();});

    const st=await get(ref(db,'roster/shared/targets'));
    if(!st.exists()) await set(ref(db,'roster/shared/targets'),{A:12,B:12});
    onValue(ref(db,'roster/shared/targets'),snap=>{liveData.targets=snap.val()||{A:12,B:12};});

    onValue(ref(db,'roster/shared/swapReqs'),snap=>{
      liveData.swapReqs=snap.val()||{};
      updateSwapNotif();
      if(currentTab==='swap') renderSwap();
    });
  }catch(e){
    ['A','B'].forEach(g=>{liveData[g].schedule={...GROUPS[g].schedule};liveData[g].members=[...GROUPS[g].members];});
    liveData.events=JSON.parse(JSON.stringify(INITIAL_EVENTS));
  }
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render();
}
initFirebase();

function renderLegend(){

  document.getElementById('legend').innerHTML=html;
}

function getEvsForDay(key){ return (liveData.events||[]).filter(ev=>(ev.dates||[]).includes(key)); }

function renderCalendar(){
  const grid=document.getElementById('calendar-grid'); grid.innerHTML='';
  const days=getDaysInMonth(viewYear,viewMonth), first=getFirstDay(viewYear,viewMonth);
  const schedule=liveData[currentGroup].schedule;
  let week=document.createElement('div'); week.className='week-row'; grid.appendChild(week);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day-cell empty';week.appendChild(e);}
  for(let d=1;d<=days;d++){
    if((first+d-1)%7===0&&d>1){week=document.createElement('div');week.className='week-row';grid.appendChild(week);}
    const key=toKey(viewYear,viewMonth,d);
    const person=schedule[key], weekend=isWeekend(viewYear,viewMonth,d), holiday=TW_HOLIDAYS[key];
    const isToday=d===now.getDate()&&viewMonth===now.getMonth()&&viewYear===now.getFullYear();
    const dayEvs=getEvsForDay(key);
    const isHolEv=dayEvs.some(ev=>ev.name.includes('假'));
    const cell=document.createElement('div'); cell.className='day-cell';
    if(weekend&&!holiday&&!isHolEv)cell.classList.add('weekend');
    if(holiday||isHolEv)cell.classList.add('holiday');
    if(isToday)cell.classList.add('today');
    if(!weekend&&!holiday&&!isHolEv){
      cell.onclick=()=>{
        if(window.handleSwapReqDayClick&&window.handleSwapReqDayClick(key)){
          // highlight selected
          document.querySelectorAll('.day-cell').forEach(c=>c.classList.remove('swap-req-sel'));
          if(swapReqDates.includes(key)) cell.style.outline='2px solid var(--accent-a)';
          return;
        }
        if(isAdmin) openEditModal(key);
      };
    }
    const num=document.createElement('span');
    num.className='day-num'+(isToday?' today':'')+(holiday||isHolEv?' hol':'');
    num.textContent=d; cell.appendChild(num);
    if(holiday){const hn=document.createElement('span');hn.className='hol-name';hn.textContent=holiday;cell.appendChild(hn);}
    if(person&&!weekend&&!holiday&&!isHolEv){
      const pb=document.createElement('span');pb.className='person-badge';
      const c=getMemberColor(person);pb.style.background=c+'18';pb.style.color=c;pb.textContent=person;cell.appendChild(pb);
    }
    dayEvs.forEach(ev=>{
      const mb=document.createElement('span');mb.className='ev-badge';
      mb.style.background=ev.color+'18';mb.style.color=ev.color;mb.textContent='🚩'+ev.name;cell.appendChild(mb);
    });
    week.appendChild(cell);
  }
  const rem=(first+days)%7;
  if(rem>0)for(let i=rem;i<7;i++){const e=document.createElement('div');e.className='day-cell empty';week.appendChild(e);}
}

function renderList(){
  const el=document.getElementById('list-view'); el.innerHTML='';
  const schedule=liveData[currentGroup].schedule, members=liveData[currentGroup].members;
  const WD=['日','一','二','三','四','五','六'];
  const days=getDaysInMonth(viewYear,viewMonth);
  const workdays=[];
  for(let d=1;d<=days;d++){
    const key=toKey(viewYear,viewMonth,d);
    if(!isWeekend(viewYear,viewMonth,d)&&!isBlocked(key)) workdays.push(key);
  }
  if(!workdays.length){el.innerHTML='<div class="list-empty">本月尚無工作日</div>';return;}
  workdays.forEach(k=>{
    const d=new Date(k+'T00:00:00'), person=schedule[k];
    const dayEvs=getEvsForDay(k);
    const isExpanded=expandedKey===k;
    const item=document.createElement('div');
    item.className='list-item'+((!person)?' unassigned':'');
    const c=person?getMemberColor(person):'var(--text3)';
    const evHtml=dayEvs.map(ev=>`<span class="list-ev" style="background:${ev.color}15;color:${ev.color};border:1px solid ${ev.color}33">🚩${ev.name}</span>`).join('');
    item.innerHTML=`

        <div><span class="list-date">${k.slice(5)}</span><span class="list-wd">（${WD[d.getDay()]}）</span></div>

        </div>
      </div>`:''}`;
    if(isAdmin) item.onclick=(e)=>{if(e.target.classList.contains('inline-btn'))return;expandedKey=isExpanded?null:k;renderList();};
    el.appendChild(item);
  });
}

function renderStats(){
  const el=document.getElementById('stats-view'); el.innerHTML='';
  const schedule=liveData[currentGroup].schedule, members=liveData[currentGroup].members;
  const target=liveData.targets[currentGroup]||12;
  const isGroupB = currentGroup==='B';

  // Determine year boundary for B group (reset at 2027)
  const yearStr = String(viewYear);
  const startKey = isGroupB && viewYear>=2027 ? `${viewYear}-01-01` : '2026-04-01';
  const endKey = `${viewYear}-12-31`;

  // Count only within current view year (and for A, from Apr 2026)
  const yearCounts={}, allDates={}, monthCounts={}, monthDates={};
  members.forEach(m=>{yearCounts[m]=0;allDates[m]=[];monthCounts[m]=0;monthDates[m]=[];});

  Object.entries(schedule).sort().forEach(([k,v])=>{
    if(k>=startKey && k<=endKey && yearCounts[v]!==undefined){
      yearCounts[v]++; allDates[v].push(k.slice(5));
    }
  });

  const curPfx=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
  Object.entries(schedule).filter(([k])=>k.startsWith(curPfx)).sort().forEach(([k,v])=>{
    if(monthCounts[v]!==undefined){monthCounts[v]++;monthDates[v].push(k.slice(5));}
  });

  // Header
  const header=document.createElement('div');
  header.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:4px;';
  const yearNote = isGroupB && viewYear>=2027 ? `（${viewYear}年獨立計算）` : viewYear===2026 ? '（4月起）' : '';
  header.innerHTML=`
    <div>
      <div style="font-size:13px;font-weight:600">${viewYear}年${viewMonth+1}月統計</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">${yearNote}</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:11px;color:var(--text3)">全年目標</span>
      ${isAdmin?`<input type="number" min="1" max="50" value="${target}" id="target-input"

        onchange="updateTarget(this.value)">`:`<strong style="font-size:13px">${target}</strong>`}
      <span style="font-size:11px;color:var(--text3)">天</span>
    </div>`;
  el.appendChild(header);

  // Year progress card
  const yearCard=document.createElement('div'); yearCard.className='stats-card';
  yearCard.innerHTML='<div class="stats-title">全年累積進度</div>';
  [...members].sort((a,b)=>yearCounts[b]-yearCounts[a]).forEach(m=>{
    const c2=getColors()[members.indexOf(m)%getColors().length];
    const done=yearCounts[m], pct=Math.min(100,Math.round(done/target*100));
    const barColor=done>=target?'#6b8b6b':done>=target*0.7?c2:'#c0614a';

    row.style.cssText='padding:8px 0;border-bottom:1px solid var(--border);';
    row.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">

// ── Auto Assign ────────────────────────────────────────────
window.autoAssign=function(){
  const schedule=liveData[currentGroup].schedule, members=liveData[currentGroup].members;
  if(!members.length){showToast('請先新增成員');return;}
  const days=getDaysInMonth(viewYear,viewMonth);
  const targets=[];
  for(let d=1;d<=days;d++){
    const key=toKey(viewYear,viewMonth,d);
    if(!isWeekend(viewYear,viewMonth,d)&&!isBlocked(key)&&!schedule[key]) targets.push(key);
  }
  if(!targets.length){showToast('本月已全部排班完成');return;}
  const curPfx=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
  const lastDuty={};
  members.forEach(m=>lastDuty[m]=null);
  Object.entries(schedule).sort().forEach(([k,v])=>{if(lastDuty[v]!==undefined&&(!lastDuty[v]||k>lastDuty[v]))lastDuty[v]=k;});
  const yearCounts={};
  members.forEach(m=>yearCounts[m]=0);
  Object.entries(schedule).forEach(([k,v])=>{if(k>='2026-04-01'&&yearCounts[v]!==undefined)yearCounts[v]++;});
  const newSched={...schedule};
  let assigned=0, failed=0;
  targets.forEach(key=>{
    const minGap=18+Math.floor(Math.random()*3);
    const eligible=members.filter(m=>{
      if(!lastDuty[m]) return true;
      return (new Date(key)-new Date(lastDuty[m]))/(1000*60*60*24)>=minGap;
    });
    if(!eligible.length){failed++;return;}
    const curCounts={};
    members.forEach(m=>curCounts[m]=0);
    Object.entries(newSched).filter(([k])=>k.startsWith(curPfx)).forEach(([,v])=>{if(curCounts[v]!==undefined)curCounts[v]++;});
    eligible.sort((a,b)=>{
      const yd=(yearCounts[a]+(curCounts[a]||0))-(yearCounts[b]+(curCounts[b]||0));
      return yd!==0?yd:(curCounts[a]||0)-(curCounts[b]||0);
    });
    const minTotal=(yearCounts[eligible[0]]||0)+(curCounts[eligible[0]]||0);
    const pool=eligible.filter(m=>(yearCounts[m]||0)+(curCounts[m]||0)===minTotal);
    const picked=pool[Math.floor(Math.random()*pool.length)];
    newSched[key]=picked; lastDuty[picked]=key;
    if(yearCounts[picked]!==undefined)yearCounts[picked]++;
    assigned++;
  });
  liveData[currentGroup].schedule=newSched;
  saveSched(); render();
  showToast(`✅ 已排 ${assigned} 天${failed?`，${failed} 天間隔不足`:''}`);
};

  }
};

window.closeSwapReqModal=function(ev){
  if(!ev||ev.target===document.getElementById('swap-req-modal'))
    document.getElementById('swap-req-modal').classList.add('hidden');
};

window.submitSwapReq=function(){
  const d1=document.getElementById('swap-date1').value;
  const d2=document.getElementById('swap-date2').value;
  if(!d1||!d2||d1===d2){showToast('請選擇兩個不同日期');return;}
  const req={group:currentGroup,date1:d1,date2:d2,status:'pending',time:Date.now()};
  push(ref(db,'roster/shared/swapReqs'),req);
  document.getElementById('swap-req-modal').classList.add('hidden');
  showToast('✅ 換班申請已送出，等候審核');
  switchTab('swap');
};

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),2200);
}
</script>
</body>
</html>
